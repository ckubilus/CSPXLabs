<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lua Quest: An Interactive Lua Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b1020; --bg2: #0f1630; --panel: #131c3a; --panel2: #18234a; --line: #263361;
  --text: #e7ebfa; --muted: #9aa5cc; --moon: #f5d76e; --moon2: #ffe9a3; --blue: #7aa2ff;
  --ok: #5ad19a; --bad: #ff7b7b; --warn: #ffb35c; --code-bg: #0a0f22;
  --r: 14px; --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --sans: "IBM Plex Sans", system-ui, sans-serif; --display: "Space Grotesk", var(--sans);
}
* { box-sizing: border-box; }
html { scroll-padding-top: 80px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 var(--sans);
  background-image: radial-gradient(1px 1px at 20% 30%, #ffffff55 50%, transparent 51%), radial-gradient(1px 1px at 70% 60%, #ffffff44 50%, transparent 51%), radial-gradient(1.5px 1.5px at 40% 80%, #ffffff33 50%, transparent 51%), radial-gradient(1px 1px at 85% 15%, #ffffff55 50%, transparent 51%);
  background-size: 380px 380px, 520px 520px, 640px 640px, 300px 300px; background-attachment: fixed; }
a { color: var(--blue); }
code { font-family: var(--mono); font-size: .88em; background: #ffffff10; padding: .1em .35em; border-radius: 5px; color: var(--moon2); }
kbd { font-family: var(--mono); font-size: .8em; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: .05em .4em; background: var(--panel2); }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.2; letter-spacing: -.01em; }

/* header */
header { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; padding: 10px 18px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.logo { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.logo span { color: var(--moon); }
.menu-btn { display: none; background: none; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 6px 10px; font-size: 18px; cursor: pointer; }
.hdr-right { margin-left: auto; display: flex; align-items: center; gap: 12px; min-width: 0; }
#hdr-level { display: flex; align-items: center; gap: 8px; }
.lv-icon { font-size: 24px; }
.lv-text { display: flex; flex-direction: column; line-height: 1.15; }
.lv-text b { font-size: 14px; } .lv-text small { color: var(--muted); font-size: 12px; }
.xpbar { width: 160px; height: 8px; border-radius: 99px; background: var(--panel2); overflow: hidden; border: 1px solid var(--line); }
#xpfill { height: 100%; width: 0; background: linear-gradient(90deg, var(--moon), var(--moon2)); transition: width .6s; }

/* layout */
.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); max-width: 1280px; margin: 0 auto; }
#nav { position: sticky; top: 58px; align-self: start; height: calc(100vh - 58px); overflow-y: auto; padding: 16px 10px 40px; border-right: 1px solid var(--line); }
.nav-sec { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 18px 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; color: var(--text); text-decoration: none; font-size: 14.5px; }
.nav-item:hover { background: var(--panel); }
.nav-item.cur { background: var(--panel2); box-shadow: inset 3px 0 0 var(--moon); }
.ni-icon { width: 22px; text-align: center; }
.ni-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ni-prog { font-size: 11px; color: var(--muted); font-family: var(--mono); }
.ni-prog.done { color: var(--ok); }
#main { padding: 28px clamp(16px, 4vw, 48px) 80px; min-width: 0; }

/* hero */
.hero { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 22px; padding: clamp(24px, 5vw, 48px);
  background: radial-gradient(120% 140% at 100% 0%, #24305f 0%, var(--bg2) 55%); }
.hero-moon { position: absolute; right: -60px; top: -60px; width: 260px; height: 260px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff6cf, var(--moon) 45%, #c9a63d 100%); box-shadow: 0 0 80px #f5d76e55; opacity: .9; }
.hero-moon::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--bg2); transform: translate(-28%, 12%); opacity: .92; }
.hero-text { position: relative; max-width: 680px; }
.hero h1 { font-size: clamp(42px, 7vw, 72px); margin: 6px 0 10px; background: linear-gradient(90deg, var(--moon2), var(--moon)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: #cdd4f0; font-size: 17px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--moon); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 18px 0 8px; }
.stat { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.stat-big { font-family: var(--display); font-size: 26px; font-weight: 700; color: var(--moon); min-width: 44px; }
.stat b { display: block; font-size: 14px; } .stat small { color: var(--muted); font-size: 12px; }
.sec-title { font-size: 24px; margin: 40px 0 12px; }
.unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.unit-card { display: flex; flex-direction: column; text-decoration: none; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; transition: transform .15s, border-color .15s; }
.unit-card:hover { transform: translateY(-2px); border-color: var(--blue); }
.unit-card.complete { border-color: #5ad19a66; }
.unit-card.cap { background: linear-gradient(135deg, #2a2350, var(--panel)); border-color: #f5d76e55; }
.uc-top { display: flex; align-items: center; gap: 8px; }
.uc-icon { font-size: 24px; } .uc-num { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.uc-badge { margin-left: auto; font-size: 20px; }
.unit-card h3 { margin: 8px 0 4px; font-size: 19px; }
.unit-card p { margin: 0 0 12px; color: var(--muted); font-size: 14px; flex: 1; }
.prog { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); font-family: var(--mono); }
.prog-bar { flex: 1; height: 6px; background: var(--bg); border-radius: 99px; overflow: hidden; }
.prog-bar div { height: 100%; background: linear-gradient(90deg, var(--blue), var(--ok)); border-radius: 99px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.badge { text-align: center; padding: 14px 10px; border-radius: var(--r); background: var(--panel); border: 1px dashed var(--line); opacity: .45; filter: grayscale(1); }
.badge.earned { opacity: 1; filter: none; border-style: solid; border-color: #f5d76e66; background: linear-gradient(180deg, #2a2a4a, var(--panel)); }
.b-icon { font-size: 30px; } .badge b { display: block; font-size: 14px; margin-top: 4px; } .badge small { color: var(--muted); font-size: 12px; line-height: 1.3; display: block; }

/* units */
.unit-hero { display: flex; gap: 20px; align-items: center; padding: 22px; border-radius: 20px; border: 1px solid var(--line); background: radial-gradient(120% 140% at 100% 0%, #24305f, var(--bg2) 60%); }
.uh-icon { font-size: 64px; line-height: 1; }
.unit-hero h2 { font-size: clamp(28px, 4vw, 40px); margin: 4px 0 6px; }
.unit-hero p { margin: 0 0 12px; color: #cdd4f0; }
.subnav { position: sticky; top: 58px; z-index: 10; display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 0; margin: 6px 0 0; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); }
.subnav button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; font: 500 14px var(--sans); cursor: pointer; }
.subnav button:hover { border-color: var(--moon); }
.lesson h3 { font-size: 22px; margin: 34px 0 8px; color: var(--moon2); }
.lesson p, .page-head p { color: #d6dcf3; max-width: 78ch; }
.page-head h2 { font-size: clamp(28px, 4vw, 38px); margin: 6px 0 8px; }
.muted { color: var(--muted); font-size: 14px; }
.callout { border-radius: 12px; padding: 12px 16px; margin: 16px 0; border: 1px solid; max-width: 82ch; }
.callout.tip { background: #7aa2ff14; border-color: #7aa2ff55; }
.callout.warn { background: #ffb35c14; border-color: #ffb35c66; }
.callout-label { font-weight: 600; font-family: var(--display); margin-bottom: 4px; }
.tbl-wrap { overflow-x: auto; margin: 16px 0; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--panel2); font-family: var(--display); font-weight: 600; }
td:first-child { color: var(--muted); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td code { white-space: pre; }

/* code */
pre.static, .editor { font: 14px/21px var(--mono); }
pre.static { background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; overflow-x: auto; margin: 12px 0; white-space: pre; }
.runnable { margin: 16px 0 22px; }
.editor { position: relative; background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px 12px 0 0; overflow: hidden; }
.editor:focus-within { border-color: var(--blue); }
.editor pre, .editor textarea { margin: 0; padding: 14px 16px; font: inherit; white-space: pre; tab-size: 2; letter-spacing: 0; word-spacing: 0; }
.editor pre { position: absolute; inset: 0; overflow: hidden; pointer-events: none; color: var(--text); }
.editor textarea { position: relative; display: block; width: 100%; min-height: 60px; resize: none; border: 0; outline: none; background: transparent; color: transparent; caret-color: var(--moon); overflow-x: auto; overflow-y: hidden; }
.editor textarea::selection { background: #7aa2ff55; color: transparent; }
.tk-c { color: #6f7ba8; font-style: italic; } .tk-s { color: #9fe0a8; } .tk-n { color: #ffb38a; } .tk-k { color: #c9a2ff; font-weight: 600; } .tk-b { color: #7ad3ff; }
.stdin-wrap { display: block; background: #0d1430; border: 1px solid var(--line); border-top: 0; padding: 8px 12px; }
.stdin-wrap span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.stdin-wrap code { font-size: 11px; }
textarea.stdin { width: 100%; background: var(--code-bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 13px/1.5 var(--mono); resize: vertical; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; background: var(--panel); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 12px 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); padding: 8px 14px; border-radius: 10px; font: 600 14px var(--sans); cursor: pointer; text-decoration: none; transition: filter .15s, transform .05s; }
.btn:hover { filter: brightness(1.15); } .btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.btn.primary { background: var(--moon); color: #1c1a0b; border-color: var(--moon); }
.btn.ok { background: #1f5a43; border-color: #2f8a66; color: #d9ffef; }
.btn.ghost { background: transparent; }
.btn.danger { background: #6d2230; border-color: #a33a4c; }
.btn.sm { padding: 5px 10px; font-size: 13px; } .btn.big { padding: 12px 20px; font-size: 16px; } .btn.wide { width: 100%; margin-top: 12px; }
.out { margin-top: 10px; background: #070b18; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.out-label { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.stdout { margin: 4px 0; font: 13.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; color: #e9f0ff; }
.err { margin: 8px 0 4px; padding: 10px 12px; border-radius: 10px; background: #ff7b7b14; border: 1px solid #ff7b7b55; font: 13.5px/1.5 var(--mono); color: #ffc9c9; white-space: pre-wrap; word-break: break-word; }
.err-hint { font-family: var(--sans); color: #ffe2b8; margin-top: 6px; font-size: 14px; white-space: normal; }
.tests { margin-top: 8px; }
.tests-head { font-weight: 600; font-family: var(--display); margin-bottom: 6px; }
.tests-head.pass { color: var(--ok); } .tests-head.fail { color: var(--warn); }
.test { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; font-size: 14px; }
.test > span { width: 18px; font-weight: 700; } .test.pass > span { color: var(--ok); } .test.fail > span { color: var(--bad); }
.test .detail { color: var(--muted); font: 12.5px/1.4 var(--mono); margin-top: 2px; word-break: break-word; }
.hints .hint { margin-top: 8px; padding: 10px 12px; border-radius: 10px; background: #7aa2ff14; border: 1px solid #7aa2ff44; font-size: 14.5px; }
.confirm { margin-top: 8px; padding: 10px 12px; border-radius: 10px; background: #ffb35c14; border: 1px solid #ffb35c55; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14.5px; }
.confirm[hidden] { display: none; }
.solution { margin-top: 10px; }
.sol-head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }

/* cards */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px clamp(14px, 3vw, 24px); margin: 16px 0; }
.card-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.card-head h4 { margin: 0; font-size: 19px; }
.status { font-size: 12px; font-family: var(--mono); padding: 3px 9px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.status.done { color: var(--ok); border-color: #5ad19a66; }
.quiz { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 12px 0; }
.quiz.done { border-color: #5ad19a55; }
.q-head { display: flex; gap: 10px; align-items: baseline; }
.q-num { font-family: var(--display); font-weight: 700; color: var(--moon); }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
.opt { text-align: left; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 14px var(--mono); cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--blue); }
.opt.right { border-color: var(--ok); background: #5ad19a22; color: #d9ffef; }
.opt.wrong { border-color: var(--bad); background: #ff7b7b18; text-decoration: line-through; opacity: .8; }
.opt:disabled { cursor: default; }
.why { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 14.5px; }
.why.right { background: #5ad19a14; border: 1px solid #5ad19a44; } .why.wrong { background: #ff7b7b12; border: 1px solid #ff7b7b44; }
.reqs-title { font-weight: 600; margin: 12px 0 6px; font-family: var(--display); }
.reqs { display: grid; gap: 6px; }
.req { display: flex; gap: 10px; align-items: flex-start; text-align: left; background: var(--bg2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font: 14.5px/1.5 var(--sans); cursor: pointer; }
.req .box { flex: 0 0 18px; height: 18px; margin-top: 2px; border-radius: 5px; border: 2px solid var(--muted); display: grid; place-items: center; }
.req.on { border-color: #5ad19a55; } .req.on .box { background: var(--ok); border-color: var(--ok); }
.req.on .box::after { content: "✓"; color: #062; font-size: 12px; font-weight: 800; }
.stretch { margin-top: 10px; padding: 10px 14px; border-radius: 12px; background: #f5d76e10; border: 1px solid #f5d76e44; font-size: 14.5px; }
.stretch ul { margin: 6px 0 0; padding-left: 20px; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 40px; flex-wrap: wrap; }
.report .row { display: flex; gap: 8px; flex-wrap: wrap; }
.report input { flex: 1; min-width: 180px; background: var(--bg2); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 9px 12px; font: 15px var(--sans); }
#report-box { width: 100%; margin-top: 10px; background: var(--code-bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: 13px/1.5 var(--mono); }
.danger-zone { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
.danger-zone span { display: inline-flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.danger-zone span[hidden] { display: none; }
.gotchas li { margin: 6px 0; }
.snips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.chip { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; font: 500 14px var(--sans); cursor: pointer; }
.chip:hover { border-color: var(--moon); }
.prose h3 { color: var(--moon2); margin-top: 26px; } .prose h3:first-child { margin-top: 4px; }
.prose li { margin: 6px 0; }
#lua-warn { margin: 0; padding: 10px 18px; background: #6d2230; color: #ffe0e5; font-size: 14px; text-align: center; }

/* toasts */
#toasts { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.toast { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; box-shadow: 0 10px 30px #0008; font-size: 14.5px; transform: translateY(20px); opacity: 0; transition: all .3s; max-width: 320px; }
.toast.show { transform: none; opacity: 1; }
.toast.xp { border-color: #f5d76e88; } .toast.badge { border-color: var(--ok); background: linear-gradient(135deg, #1f3d38, var(--panel2)); }

/* responsive */
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  .menu-btn { display: block; }
  #nav { position: fixed; top: 58px; left: 0; bottom: 0; width: 280px; z-index: 40; background: var(--bg2); transform: translateX(-105%); transition: transform .25s; height: auto; box-shadow: 10px 0 30px #0008; }
  body.nav-open #nav { transform: none; }
  .xpbar { display: none; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .uh-icon { font-size: 44px; }
  .editor, pre.static { font-size: 15px; line-height: 23px; }
  .editor textarea { font-size: 16px; } /* prevents iOS zoom */
  .editor pre { font-size: 16px; }
}
@media (max-width: 520px) {
  .lv-text small { display: none; }
  .unit-hero { flex-direction: column; align-items: flex-start; }
  .hero-moon { width: 160px; height: 160px; right: -50px; top: -50px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<script>
// ============================================================
//  LUA QUEST — course content
//  Teachers: set SHOW_SOLUTIONS to false to hide every sample solution.
// ============================================================
const SHOW_SOLUTIONS = true;
const R = String.raw;

const UNITS = [
// ------------------------------------------------------------ UNIT 1
{
  id: "u1", num: 1, icon: "🌑", title: "Hello, Lua",
  blurb: "Variables, types and numbers, plus the places your Python and Java habits will trip you up.",
  badge: { icon: "🌑", name: "First Light" },
  lesson: [

local function addItem(inv, name, qty)

local function removeItem(inv, name, qty)
  local have = inv[name] or 0
  if have < qty then return false end
  inv[name] = have - qty
  if inv[name] == 0 then inv[name] = nil end
  return true
end

  for name, qty in pairs(inv) do

  return total

local Query = {}
Query.__index = Query

function Query.from(rows)
  local copy = {}
  for i, r in ipairs(rows) do copy[i] = r end
  return setmetatable({rows = copy}, Query)
end

function Query:where(pred)
  local out = {}
  for _, r in ipairs(self.rows) do
    if pred(r) then out[#out + 1] = r end
  end
  self.rows = out
  return self

function Query:orderBy(field, direction)

  table.sort(self.rows, function(a, b)

    return a[field] < b[field]
  end)
  return self
end

  for i, r in ipairs(self.rows) do

    for _, f in ipairs(fields) do row[f] = r[f] end
    out[i] = row
  end
  self.rows = out
  return self
end

  local out = {}
  for i = 1, math.min(n, #self.rows) do out[i] = self.rows[i] end
  self.rows = out
  return self
end

function Query:count() return #self.rows end

  local counts = {}
  for _, r in ipairs(self.rows) do

  end
  return counts
end

// ---------- Lua prelude (runs before every program) ----------
const PRELUDE = R`
io = io or {}
function print(...)
  local n = select("#", ...)
  local parts = {}
  for i = 1, n do parts[i] = tostring((select(i, ...))) end
  __out(table.concat(parts, "\t") .. "\n")
end
io.write = function(...)
  for i = 1, select("#", ...) do __out(tostring((select(i, ...)))) end
  return io.stdout
end
io.read = function(fmt)
  local line = __in()
  if line == nil then return nil end
  if fmt == "n" or fmt == "*n" then return tonumber(line) end
  return line
end

local function ser(v, depth)
  depth = depth or 0
  if type(v) == "string" then return '"' .. v .. '"' end
  if type(v) ~= "table" or depth > 3 then return tostring(v) end
  local parts, n = {}, #v
  for i = 1, n do parts[#parts + 1] = ser(v[i], depth + 1) end
  local keys = {}
  for k in pairs(v) do
    if not (math.type(k) == "integer" and k >= 1 and k <= n) then keys[#keys + 1] = k end
  end
  table.sort(keys, function(a, b) return tostring(a) < tostring(b) end)
  for _, k in ipairs(keys) do parts[#parts + 1] = tostring(k) .. " = " .. ser(v[k], depth + 1) end
  return "{" .. table.concat(parts, ", ") .. "}"
end
local function deq(a, b)
  if a == b then return true end
  if type(a) ~= "table" or type(b) ~= "table" then return false end
  for k, v in pairs(a) do if not deq(v, b[k]) then return false end end
  for k in pairs(b) do if a[k] == nil then return false end end
  return true
end
local function clean(e)
  return (tostring(e):gsub("^main:%d+: ", ""))
end
function expect(label, thunk, expected)
  local ok, actual = pcall(thunk)
  if not ok then return __test(false, label, "error: " .. clean(actual)) end
  local pass = deq(actual, expected)
  __test(pass, label, pass and "" or ("expected " .. ser(expected) .. ", got " .. ser(actual)))
end
function near(label, thunk, expected)
  local ok, actual = pcall(thunk)
  if not ok then return __test(false, label, "error: " .. clean(actual)) end
  local pass = type(actual) == "number" and math.abs(actual - expected) < 1e-9
  __test(pass, label, pass and "" or ("expected about " .. tostring(expected) .. ", got " .. ser(actual)))
end
function check(label, thunk)
  local ok, res = pcall(thunk)
  if not ok then return __test(false, label, "error: " .. clean(res)) end
  __test(res and true or false, label, res and "" or "check returned false")
end
`;

// ---------- Fengari runner ----------
function luaAvailable() { return !!(window.fengari && window.fengari.lua); }

function runLua(code, stdin, withTests) {
  const result = { out: "", err: null, tests: [], ok: true };
  if (!luaAvailable()) {
    result.err = "The Lua interpreter didn't load. This page needs internet access to cdn.jsdelivr.net (see the Teacher Guide for an offline option).";
    result.ok = false;
    return result;
  }
  const F = window.fengari, lua = F.lua, lauxlib = F.lauxlib, lualib = F.lualib, toL = F.to_luastring;
  const L = lauxlib.luaL_newstate();
  lualib.luaL_openlibs(L);

  const inputs = (stdin || "").replace(/\r/g, "").split("\n");
  if (inputs.length && inputs[inputs.length - 1] === "") inputs.pop();
  let outLen = 0;
  const outParts = [];
  const fail = (L, msg) => { lua.lua_pushstring(L, toL(msg)); return lua.lua_error(L); };

  const reg = (name, fn) => { lua.lua_pushcfunction(L, fn); lua.lua_setglobal(L, toL(name)); };
  reg("__out", (L) => {
    const s = lua.lua_tojsstring(L, 1) || "";
    outLen += s.length;
    if (outLen > 200000) return fail(L, "Stopped: too much output (over 200,000 characters).");
    outParts.push(s);
    return 0;
  });
  reg("__in", (L) => {
    if (inputs.length === 0) lua.lua_pushnil(L); else lua.lua_pushstring(L, toL(inputs.shift()));
    return 1;
  });
  reg("__test", (L) => {
    result.tests.push({ ok: lua.lua_toboolean(L, 1), label: lua.lua_tojsstring(L, 2) || "", detail: lua.lua_tojsstring(L, 3) || "" });
    return 0;
  });

  const start = Date.now();
  const MASK = (lua.LUA_MASKCOUNT !== undefined) ? lua.LUA_MASKCOUNT : 8;
  lua.lua_sethook(L, (L) => {
    if (Date.now() - start > 4000) {
      lua.lua_pushstring(L, toL("Stopped: your program ran for more than 4 seconds. Is there an infinite loop?"));
      lua.lua_error(L);
    }
  }, MASK, 10000);

  const exec = (src, name) => {
    const buf = toL(src);
    let st = lauxlib.luaL_loadbuffer(L, buf, buf.length, toL("=" + name));
    if (st === lua.LUA_OK) st = lua.lua_pcall(L, 0, 0, 0);
    if (st !== lua.LUA_OK) {
      const msg = lua.lua_tojsstring(L, -1);
      lua.lua_pop(L, 1);
      return msg === null || msg === undefined ? "(error object is not a string)" : msg;
    }
    return null;
  };

  try {
    const pe = exec(PRELUDE, "prelude");
    if (pe) throw new Error("Prelude failed: " + pe);
    const full = withTests ? code + "\n" + withTests : code;
    result.err = exec(full, "main");
  } catch (e) {
    result.err = String(e && e.message ? e.message : e);
  }
  result.out = outParts.join("");
  result.ok = !result.err;
  return result;
}

  { id: "moonshot", icon: "🚀", name: "Moonshot", desc: "Finished a capstone project" },
  { id: "full-moon", icon: "🌕", name: "Full Moon", desc: "Completed all 9 units" },
];
function allBadges() {
  return UNITS.map((u) => ({ id: "unit-" + u.id, icon: u.badge.icon, name: u.badge.name, desc: `Completed Unit ${u.num}: ${u.title}` })).concat(SPECIAL_BADGES);
}
function checkBadges() {
  const earn = (id) => {
    if (S.badges[id]) return;
    S.badges[id] = Date.now();
    const b = allBadges().find((x) => x.id === id);
    if (b) toast(`${b.icon} Badge unlocked: <b>${esc(b.name)}</b>`, "badge");
  };
  if (S.ran) earn("first-run");
  UNITS.forEach((u) => { if (unitProgress(u).complete) earn("unit-" + u.id); });
  const firstTry = Object.values(S.quiz).filter((v) => v === "first").length;
  if (firstTry >= 20) earn("sharp-eye");
  const clean = Object.keys(S.ch).filter((k) => S.ch[k] && !S.chSol[k]).length;
  if (clean >= 10) earn("no-peek");
  if (CAPSTONES.some((c) => S.proj[c.id])) earn("moonshot");
  if (UNITS.every((u) => unitProgress(u).complete)) earn("full-moon");
  save();
}
function addXP(n, why) {
  const before = levelOf(S.xp).i;
  S.xp += n;
  toast(`+${n} XP · ${esc(why)}`, "xp");
  const after = levelOf(S.xp);
  if (after.i > before) toast(`${after.icon} Level up! You're now <b>${after.name}</b>`, "badge");
  checkBadges();
  save();
  renderHeader();
  renderNav();
}

// ---------- toasts ----------
function toast(html, kind) {
  const box = $("#toasts");
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.innerHTML = html;
  box.appendChild(el);
  requestAnimationFrame(() => el.classList.add("show"));
  setTimeout(() => { el.classList.remove("show"); setTimeout(() => el.remove(), 300); }, 3200);
}

// ---------- registry for runnable blocks ----------
const REG = {};

function runnableHTML(id, opts) {
  const o = Object.assign({ kind: "example", stdin: null, saved: false }, opts);
  REG[id] = Object.assign(REG[id] || {}, o);
  const code = (o.saved && S.code[id] != null) ? S.code[id] : o.starter;
  const lines = code.split("\n").length;
  let btns = `<button class="btn primary" data-act="run" data-id="${id}">▶ Run</button>`;
  if (o.kind === "challenge" || o.tests) btns += `<button class="btn ok" data-act="check" data-id="${id}">✓ Check</button>`;
  if (o.hints && o.hints.length) btns += `<button class="btn ghost" data-act="hint" data-id="${id}">💡 Hint</button>`;
  if (o.solution && SHOW_SOLUTIONS) btns += `<button class="btn ghost" data-act="sol" data-id="${id}">🔑 Solution</button>`;
  btns += `<button class="btn ghost" data-act="reset" data-id="${id}" title="Restore the starting code">↺ Reset</button>`;
  const stdinVal = o.stdin != null ? (S.stdin[id] != null ? S.stdin[id] : o.stdin) : null;
  return `
  <div class="runnable" data-rid="${id}">
    <div class="editor" data-ed="${id}">
      <pre class="hl" aria-hidden="true"></pre>
      <textarea wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Lua code editor" rows="${lines}">${esc(code)}</textarea>
    </div>
    ${stdinVal != null ? `<label class="stdin-wrap"><span>Input <small>(one line per <code>io.read()</code>)</small></span><textarea class="stdin" data-stdin="${id}" spellcheck="false" rows="${Math.max(2, Math.min(6, stdinVal.split("\n").length))}">${esc(stdinVal)}</textarea></label>` : ""}
    <div class="toolbar">${btns}</div>
    <div class="hints" data-hints="${id}"></div>
    <div class="confirm" data-confirm="${id}" hidden></div>
    <div class="solution" data-solution="${id}" hidden></div>
    <div class="out" data-out="${id}" hidden></div>
  </div>`;
}

function sizeEditor(ed) {
  const ta = $("textarea", ed), pre = $("pre", ed);
  const cs = getComputedStyle(ta);
  const LH = parseFloat(cs.lineHeight) || 21, PAD = parseFloat(cs.paddingTop) || 14;
  const lines = ta.value.split("\n").length;
  const h = lines * LH + PAD * 2 + 12;
  ta.style.height = h + "px";
  pre.style.height = h + "px";
}
function paintEditor(ed) {
  const ta = $("textarea", ed), pre = $("pre", ed);
  let v = ta.value;
  if (v.endsWith("\n")) v += " ";
  pre.innerHTML = hl(v);
  pre.scrollLeft = ta.scrollLeft;
  sizeEditor(ed);
}
function initEditors(root) {
  $$(".editor", root).forEach((ed) => {
    const ta = $("textarea", ed), pre = $("pre", ed);
    const id = ed.dataset.ed;
    paintEditor(ed);
    ta.addEventListener("input", () => {
      paintEditor(ed);
      if (REG[id] && REG[id].saved) { S.code[id] = ta.value; save(); }
    });
    ta.addEventListener("scroll", () => { pre.scrollLeft = ta.scrollLeft; pre.scrollTop = ta.scrollTop; });
    ta.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        doRun(id, false);
        return;
      }
      if (e.key === "Tab" && !e.shiftKey && !e.altKey) {
        e.preventDefault();
        insertAtCursor(ta, "  ");
      } else if (e.key === "Enter" && !e.ctrlKey && !e.metaKey) {
        const before = ta.value.slice(0, ta.selectionStart);
        const lineStart = before.lastIndexOf("\n") + 1;
        const indent = (before.slice(lineStart).match(/^[ \t]*/) || [""])[0];
        if (indent) { e.preventDefault(); insertAtCursor(ta, "\n" + indent); }
      }
    });
  });
  $$("textarea.stdin", root).forEach((t) => {
    t.addEventListener("input", () => { S.stdin[t.dataset.stdin] = t.value; save(); });
  });
}
function insertAtCursor(ta, text) {
  const s = ta.selectionStart, e = ta.selectionEnd;
  ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
  ta.selectionStart = ta.selectionEnd = s + text.length;
  ta.dispatchEvent(new Event("input"));
}
function getCode(id) { const ed = $(`.editor[data-ed="${id}"]`); return ed ? $("textarea", ed).value : ""; }
function setCode(id, code) {
  const ed = $(`.editor[data-ed="${id}"]`);
  if (!ed) return;
  const ta = $("textarea", ed);
  ta.value = code;
  ta.dispatchEvent(new Event("input"));
}
function getStdin(id) { const t = $(`textarea.stdin[data-stdin="${id}"]`); return t ? t.value : ""; }

function doRun(id, withTests) {
  const r = REG[id];
  const outEl = $(`.out[data-out="${id}"]`);
  if (!r || !outEl) return;
  const res = runLua(getCode(id), getStdin(id), withTests ? r.tests : null);
  if (!S.ran && !res.err) { S.ran = true; addXP(XP.first, "first program"); }
  let html = "";
  if (res.out) html += `<div class="out-label">Output</div><pre class="stdout">${esc(res.out)}</pre>`;
  else if (!withTests && !res.err) html += `<div class="muted">(no output: add a <code>print</code>?)</div>`;
  if (res.err) {
    const hint = errorHint(res.err);
    html += `<div class="err"><b>Error:</b> ${esc(res.err)}${hint ? `<div class="err-hint">💡 ${hint}</div>` : ""}</div>`;
  }
  if (withTests) {
    const passed = res.tests.filter((t) => t.ok).length;
    const total = res.tests.length;
    const allPass = !res.err && total > 0 && passed === total;
    html += `<div class="tests"><div class="tests-head ${allPass ? "pass" : "fail"}">${allPass ? "🎉 All checks passed!" : `${passed} / ${total} checks passed`}</div>` +
      res.tests.map((t) => `<div class="test ${t.ok ? "pass" : "fail"}"><span>${t.ok ? "✓" : "✗"}</span><div><code>${esc(t.label)}</code>${t.detail ? `<div class="detail">${esc(t.detail)}</div>` : ""}</div></div>`).join("") +
      (total === 0 && res.err ? `<div class="muted">The checks couldn't run. Fix the error above first.</div>` : "") + `</div>`;
  }
  outEl.innerHTML = html;
  outEl.hidden = false;
  if (withTests && !res.err && res.tests.length > 0 && res.tests.every((t) => t.ok)) onPassed(id);
}

function onPassed(id) {
  const r = REG[id];
  if (r.kind === "capstone") {
    if (!S.proj[id]) { S.proj[id] = true; addXP(XP.cap, "capstone complete"); markProjectDone(id); }
    return;
  }
  if (!S.ch[id]) {
    S.ch[id] = true;
    addXP(S.chSol[id] ? XP.chSol : XP.ch, "challenge passed");
    const badge = $(`[data-chstatus="${id}"]`);
    if (badge) { badge.textContent = "✓ Passed"; badge.className = "status done"; }
  }
}

// ---------- actions ----------
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act, id = b.dataset.id;
  if (act === "run") doRun(id, false);
  else if (act === "check") doRun(id, true);
  else if (act === "reset") { setCode(id, REG[id].starter); const st = $(`textarea.stdin[data-stdin="${id}"]`); if (st && REG[id].stdin != null) { st.value = REG[id].stdin; delete S.stdin[id]; save(); } }
  else if (act === "hint") showHint(id);
  else if (act === "sol") askSolution(id);
  else if (act === "sol-yes") showSolution(id);
  else if (act === "sol-no") { const c = $(`[data-confirm="${id}"]`); c.hidden = true; }
  else if (act === "sol-copy") { setCode(id, REG[id].solution); }
  else if (act === "answer") answerQuiz(b);
  else if (act === "req") toggleReq(b);
  else if (act === "proj-done") finishProject(b.dataset.pid);
  else if (act === "copy-report") copyReport();
  else if (act === "reset-all") { const c = $("#reset-confirm"); c.hidden = false; }
  else if (act === "reset-no") { $("#reset-confirm").hidden = true; }
  else if (act === "reset-yes") { S = defaultState(); try { localStorage.removeItem(LS_KEY); } catch (err) {} renderHeader(); renderNav(); route(); toast("Progress reset.", ""); }
  else if (act === "snippet") { setCode("playground", SNIPPETS[+b.dataset.i].code.replace(/^\n+/, "")); }
  else if (act === "menu") { document.body.classList.toggle("nav-open"); }
  else if (act === "goto") { location.hash = b.dataset.href; }
});

function showHint(id) {
  const r = REG[id], box = $(`[data-hints="${id}"]`);
  const shown = $$(".hint", box).length;
  if (shown >= r.hints.length) { toast("No more hints. You've got this!", ""); return; }
  const d = document.createElement("div");
  d.className = "hint";
  d.innerHTML = `<b>Hint ${shown + 1}/${r.hints.length}:</b> ${r.hints[shown]}`;
  box.appendChild(d);
}
function askSolution(id) {
  const r = REG[id], c = $(`[data-confirm="${id}"]`);
  const penalty = r.kind === "challenge" && !S.ch[id] && !S.chSol[id];
  c.innerHTML = `<span>${penalty ? "Show the solution? This challenge will then be worth 25 XP instead of 50." : "Show the sample solution?"}</span>
    <button class="btn primary sm" data-act="sol-yes" data-id="${id}">Show it</button>
    <button class="btn ghost sm" data-act="sol-no" data-id="${id}">Keep trying</button>`;
  c.hidden = false;
}
function showSolution(id) {
  const r = REG[id];
  $(`[data-confirm="${id}"]`).hidden = true;
  if (r.kind === "challenge" && !S.ch[id]) { S.chSol[id] = true; save(); }
  const box = $(`[data-solution="${id}"]`);
  box.innerHTML = `<div class="sol-head"><span>🔑 Sample solution</span><button class="btn ghost sm" data-act="sol-copy" data-id="${id}">Copy into editor</button></div><pre class="static">${hl(r.solution)}</pre>`;
  box.hidden = false;
}

function answerQuiz(b) {
  const id = b.dataset.qid, i = +b.dataset.i;
  const [uid, qn] = id.split("-q");
  const u = UNITS.find((x) => x.id === uid);
  const q = u.quiz[+qn];
  const box = b.closest(".quiz");
  if (S.quiz[id]) return;
  const why = $(".why", box);
  if (i === q.a) {
    b.classList.add("right");
    $$(".opt", box).forEach((o) => o.disabled = true);
    const first = !S.quizMiss[id];
    S.quiz[id] = first ? "first" : "later";
    why.innerHTML = `<b>${first ? "Correct!" : "Got it!"}</b> ${q.why}`;
    why.className = "why right";
    why.hidden = false;
    if (first) addXP(XP.quiz, "quiz"); else { checkBadges(); save(); renderNav(); }
    box.classList.add("done");
  } else {
    b.classList.add("wrong");
    b.disabled = true;
    S.quizMiss[id] = true;
    save();
    why.innerHTML = `<b>Not quite.</b> Try again. (No XP now, but it still counts toward finishing the unit.)`;
    why.className = "why wrong";
    why.hidden = false;
  }
}

function toggleReq(b) {
  const p = b.dataset.pid, i = +b.dataset.i;
  S.reqs[p] = S.reqs[p] || {};
  S.reqs[p][i] = !S.reqs[p][i];
  b.classList.toggle("on", !!S.reqs[p][i]);
  b.setAttribute("aria-checked", S.reqs[p][i] ? "true" : "false");
  save();
  const card = b.closest(".project");
  const all = $$(".req", card).every((x) => x.classList.contains("on"));
  const btn = $(`[data-act="proj-done"]`, card);
  if (btn && !S.proj[p]) btn.disabled = !all;
}
function finishProject(p) {
  if (S.proj[p]) return;
  S.proj[p] = true;
  const isCap = CAPSTONES.some((c) => c.id === p);
  addXP(isCap ? XP.cap : XP.proj, isCap ? "capstone complete" : "project complete");
  markProjectDone(p);
}
function markProjectDone(p) {
  const st = $(`[data-pstatus="${p}"]`);
  if (st) { st.textContent = "✓ Complete"; st.className = "status done"; }
  const btn = $(`[data-act="proj-done"][data-pid="${p}"]`);
  if (btn) { btn.disabled = true; btn.textContent = "✓ Project complete"; }
}

// ---------- progress report ----------
function reportText() {
  const nameEl = $("#student-name");
  const name = (nameEl && nameEl.value.trim()) || S.name || "(no name)";
  const lv = levelOf(S.xp);
  const lines = [`LUA QUEST progress report: ${name}`, `Date: ${new Date().toLocaleDateString()}`, `Level: ${lv.name} (${S.xp} XP)`, ""];
  UNITS.forEach((u) => {
    const qd = u.quiz.filter((q, i) => S.quiz[qid(u, i)]).length;
    const cd = u.challenges.filter((c) => S.ch[c.id]).length;
    const peek = u.challenges.filter((c) => S.chSol[c.id]).length;
    lines.push(`Unit ${u.num} ${u.title}: quiz ${qd}/${u.quiz.length}, challenges ${cd}/${u.challenges.length}${peek ? ` (${peek} solution viewed)` : ""}, project ${S.proj[pid(u)] ? "done" : "not done"}`);
  });
  lines.push("");
  CAPSTONES.forEach((c) => lines.push(`Capstone ${c.title}: ${S.proj[c.id] ? "done" : "not done"}`));
  const badges = allBadges().filter((b) => S.badges[b.id]).map((b) => b.name);
  lines.push("", `Badges (${badges.length}): ${badges.join(", ") || "none yet"}`);
  return lines.join("\n");
}
function copyReport() {
  const nameEl = $("#student-name");
  if (nameEl) { S.name = nameEl.value.trim(); save(); }
  const txt = reportText();
  const box = $("#report-box");
  box.value = txt;
  box.hidden = false;
  try {
    navigator.clipboard.writeText(txt).then(() => toast("Report copied. Paste it into your class submission.", ""), () => { box.select(); toast("Select the text below and copy it.", ""); });
  } catch (e) { box.select(); toast("Select the text below and copy it.", ""); }
}

// ---------- header & nav ----------
function renderHeader() {
  const lv = levelOf(S.xp);
  const pct = lv.next ? Math.round(100 * (S.xp - lv.floor) / (lv.next - lv.floor)) : 100;
  $("#hdr-level").innerHTML = `<span class="lv-icon">${lv.icon}</span><span class="lv-text"><b>${lv.name}</b><small>${S.xp} XP${lv.next ? ` · ${lv.next - S.xp} to next` : " · max level"}</small></span>`;
  $("#xpfill").style.width = pct + "%";
}
function navItem(href, icon, label, extra) {
  const cur = (location.hash || "#home") === href;
  return `<a href="${href}" class="nav-item${cur ? " cur" : ""}"><span class="ni-icon">${icon}</span><span class="ni-label">${label}</span>${extra || ""}</a>`;
}
function renderNav() {
  let h = navItem("#home", "🏠", "Home") + navItem("#cheatsheet", "📋", "Cheat Sheet");
  h += `<div class="nav-sec">Units</div>`;
  UNITS.forEach((u) => {
    const p = unitProgress(u);
    h += navItem(`#unit-${u.num}`, u.icon, `${u.num}. ${u.title}`, `<span class="ni-prog ${p.complete ? "done" : ""}">${p.complete ? "✓" : p.pct + "%"}</span>`);

  h += `<div class="nav-sec">For teachers</div>` + navItem("#teacher", "🍎", "Teacher Guide");
  $("#nav").innerHTML = h;
}

// ---------- views ----------
function tableHTML(t) {
  const codeCols = new Set(t.code || []);
  const cell = (c, j, tag) => `<${tag}>${codeCols.has(j) && tag === "td" ? `<code>${esc(c)}</code>` : (tag === "th" ? esc(c) : c)}</${tag}>`;
  return `<div class="tbl-wrap"><table><thead><tr>${t.head.map((c, j) => cell(c, j, "th")).join("")}</tr></thead><tbody>${t.rows.map((r) => `<tr>${r.map((c, j) => cell(c, j, "td")).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function lessonHTML(u) {
  return u.lesson.map((b, idx) => {
    const [t, a, c] = b;
    if (t === "h") return `<h3>${a}</h3>`;
    if (t === "p") return `<p>${a}</p>`;
    if (t === "code") return runnableHTML(`${u.id}-ex${idx}`, { kind: "example", starter: tc(a) });
    if (t === "static") return `<pre class="static">${hl(tc(a))}</pre>`;
    if (t === "tip") return `<div class="callout tip"><div class="callout-label">💡 ${a}</div>${c}</div>`;
    if (t === "warn") return `<div class="callout warn"><div class="callout-label">⚠️ Watch out</div>${a}</div>`;
    if (t === "table") return tableHTML(a);
    return "";
  }).join("");
}
function quizHTML(u) {
  return u.quiz.map((q, i) => {
    const id = qid(u, i), done = S.quiz[id];
    return `<div class="quiz${done ? " done" : ""}">
      <div class="q-head"><span class="q-num">Q${i + 1}</span><span class="q-text">${q.q}</span></div>
      <pre class="static">${hl(tc(q.code))}</pre>
      <div class="opts">${q.opts.map((o, j) => `<button class="opt${done && j === q.a ? " right" : ""}" data-act="answer" data-qid="${id}" data-i="${j}" ${done ? "disabled" : ""}>${esc(o)}</button>`).join("")}</div>
      <div class="why${done ? " right" : ""}" ${done ? "" : "hidden"}>${done ? `<b>Correct!</b> ${q.why}` : ""}</div>
    </div>`;

}
function challengeHTML(c, n) {
  const st = S.ch[c.id] ? `<span class="status done" data-chstatus="${c.id}">✓ Passed</span>` : `<span class="status" data-chstatus="${c.id}">${S.chSol[c.id] ? "25 XP" : "50 XP"}</span>`;
  return `<div class="card challenge">
    <div class="card-head"><h4>Challenge ${n}: ${c.title}</h4>${st}</div>
    <p>${c.task}</p>

function projectHTML(p, id, kind) {

    ${p.stretch && p.stretch.length ? `<div class="stretch"><b>⭐ Stretch goals</b><ul>${p.stretch.map((s) => `<li>${s}</li>`).join("")}</ul></div>` : ""}
    ${hasTests ? `<p class="muted">${done ? "" : "This one completes automatically when every check passes."}</p>` :

function viewUnit(u) {

  return `
  <section class="unit-hero">
    <div class="uh-icon">${u.icon}</div>

    <div class="prog"><div class="prog-bar"><div style="width:${p.pct}%"></div></div><span>${p.done}/${p.total} done</span></div></div>
  </section>
  <nav class="subnav">

    <button data-act="jump" data-to="sec-quiz">❓ Quiz</button>

  </nav>
  <section id="sec-learn" class="lesson">${lessonHTML(u)}</section>

    <a class="unit-card cap" href="#capstone"><div class="uc-top"><span class="uc-icon">🚀</span><span class="uc-num">Final</span></div><h3>Capstone</h3><p>Pick one: a SQL-style query engine, a text adventure, or Conway's Game of Life.</p></a>

function viewCheat() {
  return `
  <section class="page-head"><div class="eyebrow">Reference</div><h2>📋 Python · Java · Lua cheat sheet</h2><p>Keep this open in another tab. The single biggest thing to remember: <b>tables start at 1</b>, and <b>only <code>nil</code> and <code>false</code> are falsy</b>.</p></section>
  ${tableHTML({ head: ["", "Python", "Java", "Lua"], code: [1, 2, 3], rows: CHEAT })}
  <h2 class="sec-title">🔟 Ten gotchas</h2>
  <ol class="gotchas">
    <li>Variables are <b>global</b> unless you write <code>local</code>.</li>
    <li>Lists start at <b>1</b>; <code>t[0]</code> is <code>nil</code>.</li>
    <li><code>0</code> and <code>""</code> are <b>truthy</b>.</li>
    <li><code>~=</code> means not-equal; <code>!</code> doesn't exist.</li>
    <li><code>^</code> is exponent, not XOR. <code>/</code> always returns a float.</li>
    <li>No <code>+=</code>, <code>++</code> or <code>continue</code>.</li>
    <li>String concatenation is <code>..</code>. <code>"1" + 1</code> does math (strings auto-convert), but <code>"1" == 1</code> is false.</li>
    <li>Reading an undefined variable gives <code>nil</code>, not an error.</li>
    <li><code>obj:m()</code> passes <code>self</code>; <code>obj.m()</code> doesn't.</li>
    <li><code>for i = 1, n</code> <b>includes</b> n.</li>
  </ol>`;
}

  ${CAPSTONES.map((c) => projectHTML(c, c.id, "capstone")).join("")}`;
}

function viewTeacher() {
  return `
  <section class="page-head"><div class="eyebrow">For teachers</div><h2>🍎 Teacher guide</h2><p>Lua Quest is a self-paced, browser-based course for students who already program in Python and/or Java and know some SQL. It focuses on what's <i>different</i> about Lua, then builds toward a capstone.</p></section>
  <div class="card prose">
    <h3>Suggested pacing (about 3–4 weeks)</h3>
    ${tableHTML({ head: ["Week", "Units", "Notes"], rows: [
      ["1", "1 Hello · 2 Decisions · 3 Loops", "Fast for experienced students; the gotchas (1-indexing, truthiness, ~=) are the real content."],
      ["2", "4 Functions · 5 Tables", "Tables are the heart of Lua. Spend extra time on the records/SQL section and the inventory project."],
      ["3", "6 Strings · 7 Metatables & OOP · 8 Errors", "Unit 7 is the hardest conceptual jump. Draw the __index lookup chain on the board."],
      ["4", "9 Coroutines (optional) · Capstone", "LuaQL suits SQL-strong students; the text adventure suits creative ones; Life suits visual thinkers."],
    ]})}
    <h3>How it works</h3>
    <ul>
      <li><b>Real Lua in the browser.</b> Code runs on <a href="https://fengari.io" target="_blank" rel="noopener">Fengari</a>, a Lua 5.3 interpreter written in JavaScript, loaded from the jsDelivr CDN. Everything taught here works the same in Lua 5.4.</li>
      <li><b>Input.</b> <code>io.read()</code> reads lines from the page's <i>Input</i> box. There's no file access in the browser.</li>
      <li><b>Safety.</b> Programs that run longer than 4 seconds are stopped automatically, so an infinite loop won't freeze the page for good.</li>
      <li><b>Scoring.</b> Quiz: 10 XP on the first try. Challenge: 50 XP (25 if the student viewed the solution first). Project: 75 XP. Capstone: 150 XP. Badges are awarded for finishing units and a few milestones.</li>
      <li><b>Progress</b> is stored in each student's browser (localStorage). It doesn't sync across devices, and clearing browser data erases it. Students submit with <b>Home → Copy progress report</b>. The report is self-reported, so also collect their project code or a short demo.</li>
    </ul>
    <h3>Hosting it yourself</h3>
    <ul>
      <li>The whole course is <b>one HTML file</b>. Put it on any static host (GitHub Pages, Netlify, your school web server, or an LMS that serves HTML files).</li>
      <li><b>Hide solutions:</b> open the file in a text editor, find <code>const SHOW_SOLUTIONS = true;</code> near the top of the script, and change it to <code>false</code>.</li>
      <li><b>Offline / locked-down networks:</b> download <code>fengari-web.js</code> from npm (package <code>fengari-web</code>), place it next to the HTML file, and change the script tag's <code>src</code> to <code>fengari-web.js</code>.</li>
      <li><b>Editing content:</b> all lessons, quizzes, challenges and tests live in plain JavaScript arrays (<code>UNITS</code>, <code>CAPSTONES</code>) in the file. Challenge tests are Lua snippets using <code>expect(label, fn, expected)</code>, <code>near(...)</code> and <code>check(label, fn)</code>.</li>
    </ul>
    <h3>Running Lua outside the browser</h3>
    <ul>
      <li><b>Install:</b> macOS <code>brew install lua</code> · Debian/Ubuntu <code>sudo apt install lua5.4</code> · Windows: binaries from <a href="https://luabinaries.sourceforge.net" target="_blank" rel="noopener">LuaBinaries</a> or <code>scoop install lua</code>. Then run <code>lua myfile.lua</code>.</li>
      <li><b>Editor:</b> VS Code with the “Lua” extension (Lua Language Server) gives autocomplete and error squiggles.</li>
      <li><b>Online:</b> the official demo at <a href="https://www.lua.org/demo.html" target="_blank" rel="noopener">lua.org/demo.html</a>.</li>
    </ul>
    <h3>Capstone rubric idea (20 pts)</h3>
    ${tableHTML({ head: ["Criterion", "Points"], rows: [
      ["Meets every listed requirement", "8"],
      ["Good use of tables, functions and local scope", "4"],
      ["Handles bad input without crashing (pcall / nil checks)", "3"],
      ["Readable code: names, comments, small functions", "3"],
      ["At least one stretch goal or original feature", "2"],
    ]})}
    <h3>Where students can go next</h3>
    <ul>
      <li><b>LÖVE</b> (love2d.org): real 2D games in Lua, a great follow-up unit.</li>
      <li><b>Roblox Studio</b> uses <i>Luau</i>, a Lua dialect that adds <code>+=</code>, <code>continue</code> and optional type annotations.</li>
      <li><b>PICO-8</b> and <b>TIC-80</b>: fantasy consoles programmed in Lua.</li>
      <li><b>Neovim</b> configuration and plugins are written in Lua.</li>
    </ul>
  </div>`;
}

// ---------- router ----------
function route() {
  const h = (location.hash || "#home").slice(1);
  const main = $("#main");
  let html;
  const m = h.match(/^unit-(\d+)$/);
  if (m && UNITS[+m[1] - 1]) html = viewUnit(UNITS[+m[1] - 1]);
  else if (h === "cheatsheet") html = viewCheat();
  else if (h === "capstone") html = viewCapstone();
  else if (h === "playground") html = viewPlayground();
  else if (h === "teacher") html = viewTeacher();
  else html = viewHome();
  main.innerHTML = html;
  initEditors(main);
  renderNav();
  document.body.classList.remove("nav-open");
  window.scrollTo(0, 0);
}
function rerender() {
  const y = window.scrollY;
  route();
  window.scrollTo(0, y);
}
document.addEventListener("click", (e) => {
  const j = e.target.closest('[data-act="jump"]');
  if (j) { const t = document.getElementById(j.dataset.to); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); }
});
window.addEventListener("hashchange", route);

renderHeader();
renderNav();
route();
checkBadges();

// warn if the interpreter failed to load
setTimeout(() => { if (!luaAvailable()) $("#lua-warn").hidden = false; }, 6000);
})();

</script>
</body>
</html>
